<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Bee3">
  <title>Bee3</title>
  <!--
    Three pyramids with an eagle above them, wings spread.

    The eagle is deliberately GENERIC: a plain bird with a hooked beak and a
    fanned tail. It is NOT the Eagle of Saladin — no shield, no heraldic
    stylisation. That specific bird appears on Egypt's flag and coat of arms,
    and state emblems are protected from commercial trademark registration
    under Article 6ter of the Paris Convention. An ordinary eagle is not.

    Drawn as solid shapes with no strokes. The head is joined to the body
    rather than floating as a separate circle — a detached head reads as a
    stick figure, which several earlier attempts proved. The wings are thin and
    horizontal rather than thick and curved for the same reason in reverse:
    thick curved wings read as leaves, and the mark becomes a seedling.
  -->
  <g fill="currentColor">
    <!-- Pyramids, lower third. Overlapping bases read as a cluster. -->
    <path d="M1 44 L9 34 L17 44 Z" />
    <path d="M14 44 L24 30 L34 44 Z" />
    <path d="M31 44 L39 34 L47 44 Z" />

    <!-- Head and body, one shape. -->
    <path d="M24 5.4 C26 5.4 27.6 7 27.6 9 L27.6 12 L26.8 17 L25.6 27 L22.4 27 L21.2 17 L20.4 12 L20.4 9 C20.4 7 22 5.4 24 5.4 Z" />
    <!-- Hooked beak. -->
    <path d="M27.4 7.8 L32.2 8.8 L29.8 10.1 L31.4 10.9 L27.4 11.2 Z" />
    <!-- Wings. -->
    <path d="M22.2 13.4 C16.5 9.6 9 8.4 2.5 11.4 C8 15.4 14.8 18.6 22.2 19.8 Z" />
    <path d="M25.8 13.4 C31.5 9.6 39 8.4 45.5 11.4 C40 15.4 33.2 18.6 25.8 19.8 Z" />
    <!-- Fanned tail. -->
    <path d="M22.4 26 L20.6 32.5 L24 30.4 L27.4 32.5 L25.6 26 Z" />
  </g>
</svg>
